<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biomass - Sci-Fi Containment Protocol (Rust WASM)</title>
    <meta
      name="description"
      content="Biomass turn-based containment strategy puzzle game written in Rust & Macroquad, compiled to WebAssembly."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2339ff14'><path d='M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z'/></svg>"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0a0e14;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #glcanvas {
        width: 100%;
        height: 100%;
        max-width: 1000px;
        max-height: 900px;
        display: block;
        outline: none;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="glcanvas" tabindex="1"></canvas>

    <script>
      // Load mq_js_bundle.js with cache busting
      const script = document.createElement("script");
      script.src = "mq_js_bundle.js?t=" + Date.now();
      script.onload = function () {
        console.log(
          "mq_js_bundle.js loaded, registering biomass_audio plugin...",
        );
        miniquad_add_plugin({
          register_plugin: function (env_obj) {
            var STORAGE_KEY = "biomass_level";
            env_obj.env.storage_save = function (value) {
              try {
                localStorage.setItem(STORAGE_KEY, value.toString());
                return 1;
              } catch (e) {
                return 0;
              }
            };
            env_obj.env.storage_load = function () {
              try {
                var val = localStorage.getItem(STORAGE_KEY);
                if (val === null) return -1;
                var parsed = parseInt(val, 10);
                return isNaN(parsed) ? -1 : parsed;
              } catch (e) {
                return -1;
              }
            };
          },
          version: 1,
          name: "biomass_storage",
        });
        load("biomass.wasm?t=" + Date.now());
      };
      document.head.appendChild(script);
    </script>
  </body>
</html>
