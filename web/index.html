    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0a0e14;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #glcanvas {
        width: 100%;
        height: 100%;
        max-width: 1000px;
        max-height: 900px;
        display: block;
        outline: none;
        flex: 1;
      }

  <body>
    <canvas id="glcanvas" tabindex="1"></canvas>

    <script>
      window.biomassAudioCtx = null;
      window.biomassAudioUnlocked = false;

      const fetchedBuffers = {};
      const audioBuffers = {};

      (function preloadBytes() {
        const files = ['wall', 'tick', 'pop', 'win', 'fanfare', 'loss', 'click', 'error'];
        for (const file of files) {
          fetch(`assets/${file}.wav`)
            .then((r) => r.arrayBuffer())
            .then((b) => (fetchedBuffers[file] = b))
            .catch((e) => console.error(e));
        }
      })();

      async function decodeAll(ctx) {
        for (const [file, buffer] of Object.entries(fetchedBuffers)) {
          if (!audioBuffers[file]) {
            try {
              audioBuffers[file] = await ctx.decodeAudioData(buffer.slice(0));
            } catch (e) {}
          }
        }
      }

      function getBiomassAudioCtx() {
        if (!window.biomassAudioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            window.biomassAudioCtx = new AudioCtx();
            decodeAll(window.biomassAudioCtx);
          }
        }
        return window.biomassAudioCtx;
      }

      function unlockAudioContext() {
        let ctx = getBiomassAudioCtx();
        if (!ctx) return;

        if (ctx.state === 'suspended') {
          ctx.resume();
        }

        if (!window.biomassAudioUnlocked) {
          const buffer = ctx.createBuffer(1, 1, 22050);
          const source = ctx.createBufferSource();
          source.buffer = buffer;
          source.connect(ctx.destination);
          if (source.start) source.start(0);
          else if (source.play) source.play(0);

          window.biomassAudioUnlocked = true;
        }
      }

      ['click', 'mousedown', 'pointerdown', 'keydown', 'touchstart'].forEach((evt) => {
        window.addEventListener(
          evt,
          (e) => {
            if (
              e.type === 'keydown' &&
              (e.key === 'Meta' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Shift')
            ) {
              return;
            }
            unlockAudioContext();
          },
          { capture: true }
        );
      });

      window.biomassPlaySound = function (type) {
        let ctx = getBiomassAudioCtx();
        if (!ctx) return;

        if (ctx.state === 'suspended') {
          ctx
            .resume()
            .then(() => playBuffer(ctx, type))
            .catch((e) => console.warn('Audio blocked', e));
        } else {
          playBuffer(ctx, type);
        }
      };

      async function playBuffer(ctx, type) {
        await decodeAll(ctx);
        const buffer = audioBuffers[type];
        if (!buffer) return;

        try {
          let source = ctx.createBufferSource();
          source.buffer = buffer;
          source.connect(ctx.destination);
          source.start(0);
        } catch (e) {
          console.error('Audio playback failed', e);
        }
      }
    </script>
    <script>
      // Load mq_js_bundle.js with cache busting
      const script = document.createElement('script');
      script.src = 'mq_js_bundle.js?t=' + Date.now();
      script.onload = function () {
        miniquad_add_plugin({
          register_plugin: function (env_obj) {
            env_obj.env.play_sound_wall = function () {
              if (window.biomassPlaySound) window.biomassPlaySound('wall');
            };
            env_obj.env.play_sound_tick = function () {
              if (window.biomassPlaySound) window.biomassPlaySound('tick');
            };
            env_obj.env.play_sound_pop = function () {
              if (window.biomassPlaySound) window.biomassPlaySound('pop');
            };
            env_obj.env.play_sound_win = function () {
              if (window.biomassPlaySound) window.biomassPlaySound('win');
            };
            env_obj.env.play_sound_fanfare = function () {
              if (window.biomassPlaySound) window.biomassPlaySound('fanfare');
            };
            env_obj.env.play_sound_loss = function () {
              if (window.biomassPlaySound) window.biomassPlaySound('loss');
            };
            env_obj.env.play_sound_click = function () {
              if (window.biomassPlaySound) window.biomassPlaySound('click');
            };
            env_obj.env.play_sound_error = function () {
              if (window.biomassPlaySound) window.biomassPlaySound('error');
            };
          },
          version: 1,
          name: 'biomass_audio',
        });
        miniquad_add_plugin({
          register_plugin: function (env_obj) {
            var STORAGE_KEY = 'biomass_level';
            env_obj.env.storage_save = function (value) {
              try {
                localStorage.setItem(STORAGE_KEY, value.toString());
                return 1;
              } catch (e) {
                return 0;
              }
            };
            env_obj.env.storage_load = function () {
              try {
                var val = localStorage.getItem(STORAGE_KEY);
                if (val === null) return -1;
                var parsed = parseInt(val, 10);
                return isNaN(parsed) ? -1 : parsed;
              } catch (e) {
                return -1;
              }
            };
          },
          version: 1,
          name: 'biomass_storage',
        });
        miniquad_add_plugin({
          register_plugin: function (env_obj) {
            env_obj.env.biomass_get_system_language = function () {
              const lang = (
                navigator.language ||
                (navigator.languages && navigator.languages[0]) ||
                'en'
              ).toLowerCase();
              if (lang.startsWith('ru')) return 1;
              if (lang.startsWith('es')) return 2;
              if (lang.startsWith('de')) return 3;
              if (lang.startsWith('fr')) return 4;
              if (lang.startsWith('ja') || lang.startsWith('jp')) return 5;
              if (lang.startsWith('zh') || lang.startsWith('cn')) return 6;
              if (lang.startsWith('ko') || lang.startsWith('kr')) return 7;
              return 0; // Default en-US
            };
          },
          version: 1,
          name: 'biomass_locale',
        });
        load('biomass.wasm?t=' + Date.now());
      };

      document.head.appendChild(script);
    </script>
  </body>
</html>
