[package]
name = "biomass"
version = "0.1.0"
edition = "2021"
authors = ["Dymka"]
description = "Biomass - Sci-Fi Turn-Based Containment Strategy Game"

[dependencies]
macroquad = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
macroquad = { version = "0.4", features = ["audio"] }

[package.metadata.android]
package_name = "org.dymka.biomass"
label = "Biomass"
version_code = 1
version_name = "0.1.1"
android_version = 35
target_sdk_version = 35
min_sdk_version = 23
assets = "assets/"
res = "res"
icon = "@mipmap/ic_launcher"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.activity_attributes]
"android:exported" = "true"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
